<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13132A" />
      <stop offset="100%" stop-color="#0D0D1A" />
    </linearGradient>

    <!-- Globe Glow Gradient -->
    <radialGradient id="globeSphere" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8B84FF" />
      <stop offset="50%" stop-color="#6C63FF" />
      <stop offset="100%" stop-color="#4032C7" />
    </radialGradient>

    <!-- Orbit Trail Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6584" stop-opacity="0.1" />
      <stop offset="60%" stop-color="#FF6584" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFD166" stop-opacity="1" />
    </linearGradient>

    <!-- Plane Gradient -->
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE3EC" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(108, 99, 255, 0.4)" stroke-width="1.5" />

  <!-- Background Ambient Glow -->
  <circle cx="32" cy="32" r="18" fill="#6C63FF" opacity="0.25" filter="url(#glow)" />

  <!-- Main Globe Sphere -->
  <circle cx="32" cy="32" r="17" fill="url(#globeSphere)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />

  <!-- Globe Latitudes / Longitudes -->
  <!-- Equator -->
  <ellipse cx="32" cy="32" rx="17" ry="5.5" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1" />
  <!-- Upper Latitude -->
  <ellipse cx="32" cy="24" rx="14" ry="4" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="0.8" stroke-dasharray="2 1.5" />
  <!-- Lower Latitude -->
  <ellipse cx="32" cy="40" rx="14" ry="4" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="0.8" stroke-dasharray="2 1.5" />

  <!-- Prime Meridian (Central Vertical Arc) -->
  <ellipse cx="32" cy="32" rx="7.5" ry="17" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1" />

  <!-- Continental Abstract Shapes -->
  <path d="M22 23 C24 20, 27 21, 29 25 C30 27, 28 29, 26 28 C23 27, 21 25, 22 23 Z" fill="rgba(255, 255, 255, 0.3)" />
  <path d="M35 34 C38 31, 42 33, 44 37 C42 41, 38 42, 36 39 C34 37, 34 35, 35 34 Z" fill="rgba(255, 255, 255, 0.25)" />

  <!-- Dynamic Orbit Ring -->
  <ellipse cx="32" cy="32" rx="23" ry="10" fill="none" stroke="url(#orbitGrad)" stroke-width="2.2" transform="rotate(-30 32 32)" stroke-linecap="round" />

  <!-- Orbit Particle Dots -->
  <circle cx="13" cy="39" r="1.2" fill="#FF6584" opacity="0.6" />
  <circle cx="48" cy="22" r="1.5" fill="#FFD166" opacity="0.9" />

  <!-- Stylized Fast Travel Plane (At top right of orbit) -->
  <g transform="translate(47, 16) rotate(35) scale(0.9)">
    <!-- Plane Shadow / Glow -->
    <path d="M0 -7 L6 5 L0 2 L-6 5 Z" fill="rgba(255, 101, 132, 0.6)" filter="url(#glow)" />
    <!-- Plane Body -->
    <path d="M0 -8 L7 5 L0 1.5 L-7 5 Z" fill="url(#planeGrad)" />
    <!-- Wing Highlight -->
    <path d="M0 -8 L2.5 4 L0 1.5 Z" fill="#FFFFFF" opacity="0.9" />
    <!-- Cockpit Point -->
    <circle cx="0" cy="-5" r="1" fill="#6C63FF" />
  </g>

  <!-- Location Pin Accent -->
  <g transform="translate(28, 14) scale(0.65)">
    <path d="M6 0 C2.7 0 0 2.7 0 6 C0 10.5 6 16 6 16 C6 16 12 10.5 12 6 C12 2.7 9.3 0 6 0 Z" fill="#FF6584" filter="url(#glow)" />
    <circle cx="6" cy="6" r="2.5" fill="#FFFFFF" />
  </g>
</svg>