<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="gtGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- High-visibility Squircle Background Badge -->
  <rect width="512" height="512" rx="120" fill="url(#gtBg)" />

  <!-- Bold Globe Ring Arc -->
  <path d="M 120 360 A 170 170 0 1 1 392 360" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" opacity="0.3" />
  
  <!-- Bold Globe Equator Arc -->
  <ellipse cx="256" cy="310" rx="150" ry="42" fill="none" stroke="#ffffff" stroke-width="26" opacity="0.35" />

  <!-- Soaring Airplane Silhouette -->
  <g transform="translate(10, 0)">
    <!-- Soft Drop Shadow -->
    <path d="M 240 105 L 295 215 L 415 265 L 295 295 L 255 395 L 215 305 L 115 285 Z" fill="#000000" opacity="0.2" />
    
    <!-- White Aircraft Body & Wings -->
    <path d="M 250 85 L 305 195 L 425 245 L 305 275 L 265 375 L 225 285 L 125 265 Z" fill="#ffffff" />
    
    <!-- Bright Amber Gold Wing Accent -->
    <path d="M 250 85 L 305 195 L 265 255 Z" fill="url(#gtGold)" />
  </g>
</svg>
